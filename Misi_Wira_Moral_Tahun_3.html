<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misi Wira Moral Tahun 3 — Jelajah Sekolah Harmoni</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#233251;background:#ecf4ff}*{box-sizing:border-box}body{margin:0}.app{max-width:1030px;margin:auto;padding:18px}.hero{background:linear-gradient(115deg,#204ca4,#15b7a5);color:white;border-radius:24px;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:15px}.hero h1{margin:5px 0;font-size:clamp(24px,4vw,38px)}.sub{font-size:13px;letter-spacing:.06em;font-weight:800}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.nav button{background:white;color:#254178}.panel{background:#fff;border:1px solid #dbe5f4;border-radius:20px;padding:20px;margin:13px 0;box-shadow:0 6px 20px #24538810}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 17px;font-weight:750;transition:transform .1s;background:#1e59b7;color:white}button:hover{transform:translateY(-1px)}button:disabled{opacity:.55;cursor:not-allowed}.yellow{background:#ffbb35;color:#453200}.ghost{background:#e5efff;color:#1b4b94}.good{background:#16805b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.input{padding:13px;border:1px solid #b9cee9;border-radius:10px;font:inherit;width:min(100%,400px)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.card{background:#f4f8ff;border:2px solid #d7e5fb;border-radius:16px;padding:16px;cursor:pointer;text-align:left;color:#213858}.card:hover,.card:focus{border-color:#2d7bd8}.card.done{background:#e4f8ed;border-color:#86d3ac}.card strong{display:block;margin:7px 0}.muted{color:#687b98;font-size:13px}.house{background:linear-gradient(#d6f1ff 67%,#bce7aa 67%);border-radius:16px;min-height:265px;padding:20px;text-align:center;overflow:hidden}.roof{height:0;border-left:280px solid transparent;border-right:280px solid transparent;border-bottom:68px solid #ed7959;max-width:100%;margin:auto}.rooms{background:#fff1ca;border:7px solid #daaa69;max-width:550px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:90px 90px;gap:4px;padding:4px}.room{background:#fff;border:2px solid #f0d7ab;border-radius:5px;color:#364567;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:13px;padding:3px}.room:hover{background:#d9efff}.choices{display:grid;gap:11px}.choice{display:block;text-align:left;background:#eef5ff;color:#173b6e;border:2px solid #d9e9fc}.choice.selected{border-color:#265da8}.choice.correct{background:#e1f9e9;border-color:#27a56a}.choice.wrong{background:#ffe4e4;border-color:#ed6666}.bar{height:13px;border-radius:20px;background:#dce7f4;overflow:hidden}.bar>div{height:100%;background:#25ae7b;transition:width .2s}.pill{display:inline-block;padding:6px 10px;border-radius:20px;background:#e6f1ff;color:#174d98;font-size:13px;font-weight:700}.example{background:#eaf9f1;padding:12px 14px;border-radius:12px}.cert{border:10px double #d3ac40;border-radius:6px;text-align:center;max-width:750px;margin:auto;padding:34px 20px;background:#fffdf5;color:#273455}.cert h2{font-size:32px;color:#b48824}.cert .recipient{font-size:30px;font-weight:800;border-bottom:2px solid #d3ac40;display:inline-block;min-width:240px;padding:8px}.hide{display:none!important}textarea{font:inherit;width:100%;max-width:700px;min-height:75px;padding:10px;border:1px solid #adc3df;border-radius:10px}h2{margin-top:0}#toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#193e72;color:#fff;border-radius:15px;padding:10px 16px;display:none;z-index:10}@media(max-width:620px){.app{padding:9px}.hero{padding:17px}.panel{padding:16px}.roof{border-left-width:155px;border-right-width:155px;border-bottom-width:45px}.rooms{grid-template-rows:80px 80px}.room{font-size:10px;padding:2px}.cert{padding:15px 8px}.cert .recipient{font-size:22px;min-width:0}}@media print{body{background:#fff}.app>*:not(#content){display:none!important}#content>*:not(.cert){display:none!important}.cert{border-color:#c79a27;box-shadow:none;padding:45px!important;max-width:100%}button,.no-print{display:none!important}@page{size:A4 landscape;margin:13mm}}
</style></head><body><div class="app"><header class="hero"><div><div class="sub">📘 PENDIDIKAN MORAL • TAHUN 3 • SAYA DAN SEKOLAH</div><h1>🏫 Misi Wira Moral</h1><div>Jelajah Sekolah Harmoni — 14 Nilai Murni</div></div><strong>⭐ <span id="counter">0/14 unit</span></strong></header><nav class="nav" aria-label="Navigasi utama"><button onclick="home()">🏠 Utama</button><button onclick="mapPage()">🗺️ Peta Sekolah</button><button onclick="feelingPage()">😊 Perasaan Saya</button><button onclick="startQuiz()">🧠 Kuiz 20 Soalan</button><button id="audioButton" onclick="toggleAudio()">🔊 Audio: Hidup</button></nav><main id="content"></main><footer class="panel muted">Modul Ulang Kaji Pendidikan Moral Tahun 3 • Kegunaan PdPR dan pembelajaran kendiri. Kuiz disemak pada peranti; keputusan tidak dihantar kepada guru secara automatik.</footer></div><div id="toast" role="status"></div><script>
const units=[["Kepercayaan kepada Tuhan", "Perayaan Warga Sekolah", "Menghormati amalan agama dan kepercayaan warga sekolah.", "Menghormati perayaan rakan", "Mengucapkan ucapan yang sesuai semasa perayaan", "Memupuk keharmonian dan perpaduan", "🕌"], ["Baik hati", "Baik Hati Nilai Mulia", "Membantu orang lain dengan ikhlas.", "Membantu rakan membawa buku", "Membantu rakan yang menghadapi kesukaran", "Mengeratkan persahabatan", "💗"], ["Bertanggungjawab", "Murid Bertanggungjawab", "Melaksanakan tugas dengan baik dan amanah.", "Menyiapkan kerja sekolah", "Menjalankan tugas sebagai murid bertugas", "Melancarkan urusan kelas", "📚"], ["Berterima kasih", "Berterima Kasih Amalan Mulia", "Menghargai pertolongan dan kebaikan orang lain.", "Mengucapkan terima kasih kepada guru", "Menghargai bantuan pekerja sekolah", "Memupuk hubungan yang baik", "🙏"], ["Hemah tinggi", "Beradab Sopan Pekerti Terpuji", "Bersopan santun dalam tutur kata dan tingkah laku.", "Menggunakan bahasa yang sopan", "Meminta izin sebelum meminjam barang", "Mewujudkan hubungan yang mesra", "🌸"], ["Hormat", "Hormati Semua Amalan Kami", "Menghargai dan menghormati warga sekolah.", "Memberikan salam atau sapaan sopan", "Menghormati guru dan pelawat sekolah", "Mewujudkan suasana harmoni", "🤝"], ["Kasih sayang", "Sekolah Kebanggaanku", "Mengambil berat dan menyayangi warga serta persekitaran sekolah.", "Menjaga kebersihan sekolah", "Menjaga kemudahan sekolah", "Sekolah selesa dan ceria", "🏫"], ["Keadilan", "Sikap Adil Sekolah Sejahtera", "Bersikap tidak berat sebelah terhadap orang lain.", "Memberikan peluang yang adil", "Mengagihkan tugas secara adil", "Mengelakkan rasa tidak puas hati", "⚖️"], ["Keberanian", "Hadapi Cabaran Demi Sekolah", "Berani menghadapi cabaran dan melakukan perkara betul secara selamat.", "Berani mencuba aktiviti baharu", "Melaporkan kejadian buli kepada guru", "Membina keyakinan dan keselamatan", "🦁"], ["Kejujuran", "Jujur Amalan Warga Sekolah", "Bercakap benar serta bersikap amanah.", "Mengakui kesilapan", "Memulangkan barang yang dijumpai", "Membina kepercayaan", "💎"], ["Kerajinan", "Rajin Tangga Kejayaan", "Berusaha dengan tekun untuk mencapai kejayaan.", "Mengulang kaji pelajaran", "Menyiapkan tugasan dengan tekun", "Meningkatkan pencapaian", "✏️"], ["Kerjasama", "Kerjasama Budaya Kami", "Melaksanakan tugasan bersama-sama dengan baik.", "Membersihkan kelas bersama rakan", "Menyiapkan tugasan kumpulan", "Tugasan lebih mudah diselesaikan", "🧩"], ["Kesederhanaan", "Amalan Hidup di Sekolah", "Tidak berlebih-lebihan dalam penggunaan sesuatu.", "Membeli makanan secukupnya", "Menggunakan alat tulis yang masih elok", "Mengelakkan pembaziran", "🌱"], ["Toleransi", "Toleransi Sesama Warga Sekolah", "Bersabar, bertolak ansur dan menghormati perbezaan.", "Menghormati pendapat rakan", "Bergilir menggunakan peralatan", "Mengekalkan keharmonian sekolah", "🕊️"]],qs=[{"unit": 1, "q": "Apakah tindakan yang sesuai ketika rakan menyambut perayaan agamanya?", "options": ["Menghormati perayaannya.", "Mengejek perayaannya.", "Melarangnya menyambut perayaan.", "Memaksanya mengikut kepercayaan kita."], "answer": 0, "why": "Kita perlu menghormati kepelbagaian perayaan dan kepercayaan warga sekolah."}, {"unit": 2, "q": "Rakan kamu menjatuhkan buku ketika berjalan. Apakah tindakan yang baik?", "options": ["Mentertawakannya.", "Membantu mengutip buku.", "Meninggalkannya.", "Menyembunyikan bukunya."], "answer": 1, "why": "Membantu rakan menunjukkan nilai baik hati."}, {"unit": 3, "q": "Apakah tindakan yang menunjukkan sikap bertanggungjawab?", "options": ["Mengabaikan tugas kelas.", "Merosakkan peralatan.", "Melaksanakan tugas yang diberikan.", "Membiarkan kelas kotor."], "answer": 2, "why": "Murid bertanggungjawab melaksanakan tugas dengan baik."}, {"unit": 4, "q": "Guru membantu kamu memahami pelajaran yang sukar. Apakah tindakan kamu?", "options": ["Mendiamkan diri.", "Memarahi guru.", "Mengabaikan guru.", "Mengucapkan terima kasih."], "answer": 3, "why": "Ucapan terima kasih menunjukkan penghargaan terhadap bantuan."}, {"unit": 5, "q": "Apakah contoh perlakuan bersopan santun?", "options": ["Bercakap dengan bahasa yang sopan.", "Menjerit kepada guru.", "Mengejek rakan.", "Memotong percakapan orang lain."], "answer": 0, "why": "Bahasa yang sopan mencerminkan nilai hemah tinggi."}, {"unit": 6, "q": "Seorang pelawat bertanya arah ke pejabat sekolah. Apakah tindakan yang sesuai?", "options": ["Mengabaikan pelawat.", "Menunjukkan arah dengan sopan.", "Mentertawakan pelawat.", "Menyuruh pelawat pergi."], "answer": 1, "why": "Kita perlu menghormati pelawat sekolah."}, {"unit": 7, "q": "Bagaimanakah cara menunjukkan kasih sayang terhadap sekolah?", "options": ["Menconteng dinding.", "Membuang sampah merata-rata.", "Menjaga kebersihan sekolah.", "Merosakkan kerusi."], "answer": 2, "why": "Menjaga kebersihan menunjukkan rasa sayang terhadap sekolah."}, {"unit": 8, "q": "Apakah contoh tindakan yang adil?", "options": ["Memilih kawan rapat sahaja.", "Mengutamakan diri sendiri.", "Tidak memberi peluang kepada rakan.", "Memberikan peluang yang adil kepada semua ahli kumpulan."], "answer": 3, "why": "Keadilan bermaksud tidak berat sebelah."}, {"unit": 9, "q": "Kamu melihat seorang murid dibuli. Apakah tindakan yang menunjukkan keberanian dan menjaga keselamatan?", "options": ["Melaporkan kejadian kepada guru.", "Membantu pembuli.", "Merakam untuk mengejek mangsa.", "Berpura-pura tidak tahu."], "answer": 0, "why": "Melaporkan kejadian kepada guru ialah tindakan yang berani dan selamat."}, {"unit": 10, "q": "Kamu terpecahkan pasu bunga kelas. Apakah tindakan yang jujur?", "options": ["Menyalahkan rakan.", "Mengaku kesilapan kepada guru.", "Menyembunyikan kejadian.", "Berpura-pura tidak tahu."], "answer": 1, "why": "Mengakui kesilapan menunjukkan kejujuran."}, {"unit": 11, "q": "Apakah amalan murid yang rajin?", "options": ["Tidak membuat latihan.", "Mengabaikan pelajaran.", "Mengulang kaji dengan tekun.", "Meniru kerja rakan."], "answer": 2, "why": "Kerajinan membantu murid meningkatkan pengetahuan dan kemahiran."}, {"unit": 12, "q": "Kelas kamu perlu dibersihkan. Apakah tindakan yang menunjukkan kerjasama?", "options": ["Membiarkan rakan bekerja sendiri.", "Bermain ketika rakan bekerja.", "Mengelakkan diri daripada bertugas.", "Membersihkan kelas bersama-sama."], "answer": 3, "why": "Kerjasama memudahkan tugasan diselesaikan."}, {"unit": 13, "q": "Apakah amalan bersederhana di sekolah?", "options": ["Menggunakan alat tulis yang masih elok.", "Membeli semua barang yang disukai.", "Membazirkan makanan.", "Menghabiskan wang tanpa keperluan."], "answer": 0, "why": "Kesederhanaan membantu mengelakkan pembaziran."}, {"unit": 14, "q": "Rakan kamu mempunyai pendapat berbeza. Apakah tindakan yang menunjukkan toleransi?", "options": ["Memaksa rakan bersetuju.", "Mendengar pendapat rakan dengan baik.", "Memarahi rakan.", "Mengejek pendapatnya."], "answer": 1, "why": "Toleransi melibatkan sikap menghormati perbezaan pendapat."}, {"unit": 1, "q": "Mengapakah kita perlu menghormati perayaan warga sekolah?", "options": ["Untuk menimbulkan pergaduhan.", "Untuk membezakan layanan.", "Untuk memupuk keharmonian.", "Untuk memaksa orang lain."], "answer": 2, "why": "Sikap saling menghormati membantu memupuk keharmonian."}, {"unit": 2, "q": "Rakan kamu menghadapi kesukaran membawa buku yang banyak. Apakah tindakan yang baik?", "options": ["Menyembunyikan bukunya.", "Mentertawakannya.", "Mengabaikannya.", "Menawarkan bantuan."], "answer": 3, "why": "Menawarkan bantuan secara ikhlas menunjukkan nilai baik hati."}, {"unit": 3, "q": "Kamu telah diberikan tugas menyusun buku di kelas. Apakah tindakan yang bertanggungjawab?", "options": ["Menyusun buku seperti yang diarahkan.", "Menyuruh rakan melakukan semua tugas.", "Meninggalkan buku berselerak.", "Mengelakkan diri daripada bertugas."], "answer": 0, "why": "Melaksanakan amanah menunjukkan sikap bertanggungjawab."}, {"unit": 8, "q": "Dua kumpulan ingin menggunakan peralatan yang sama. Apakah tindakan yang adil?", "options": ["Memberikan kepada kumpulan kegemaran sahaja.", "Menetapkan giliran yang adil.", "Tidak membenarkan sesiapa menggunakannya.", "Mengambil peralatan untuk diri sendiri."], "answer": 1, "why": "Pembahagian giliran yang adil membolehkan semua murid mendapat peluang."}, {"unit": 14, "q": "Kamu berjaya bertolak ansur dengan rakan. Apakah perasaan positif yang mungkin kamu alami?", "options": ["Benci kerana perlu berkongsi.", "Marah kerana rakan berbeza pendapat.", "Gembira kerana hubungan menjadi baik.", "Dendam terhadap rakan."], "answer": 2, "why": "Bertoleransi dapat mengeratkan hubungan persahabatan."}, {"unit": 10, "q": "Kamu menjumpai dompet di kawasan sekolah. Apakah tindakan yang jujur?", "options": ["Mengambil wang dalam dompet.", "Menyembunyikan dompet.", "Membiarkan dompet di tempat berbahaya.", "Menyerahkan dompet kepada guru."], "answer": 3, "why": "Memulangkan barang yang dijumpai menunjukkan sikap amanah dan jujur."}];
const app=document.querySelector('#content');let name=localStorage.getItem('moral3_name')||'',visited=new Set(JSON.parse(localStorage.getItem('moral3_visited')||'[]')),audioOn=true,qi=0,answers=Array(20).fill(null),quizDone=false;
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function stopAudio(){if('speechSynthesis' in window)speechSynthesis.cancel()}
function speak(s){stopAudio();if(!audioOn){toast('Audio dimatikan');return}if(!('speechSynthesis'in window)){toast('Bacaan suara tidak disokong pada pelayar ini.');return}let u=new SpeechSynthesisUtterance(s);u.lang='ms-MY';u.rate=.85;let voices=speechSynthesis.getVoices(),my=voices.find(v=>/^ms[-_]/i.test(v.lang));if(my)u.voice=my;speechSynthesis.speak(u)}
function saveName(){let field=document.querySelector('#studentName');if(field){name=field.value.trim().slice(0,80);localStorage.setItem('moral3_name',name)}updateHead()}
function updateHead(){document.querySelector('#counter').textContent=visited.size+'/14 unit';document.querySelector('#audioButton').textContent='🔊 Audio: '+(audioOn?'Hidup':'Mati')}
function setPage(html){stopAudio();app.innerHTML=html;window.scrollTo({top:0,behavior:'instant'});updateHead()}
function home(){setPage(`<section class="panel"><h2>Selamat datang, Wira Moral! 🌈</h2><p>Jelajah sekolah, kenali 14 nilai murni, dengar nota, dan jawab 20 soalan untuk memperoleh sijil.</p><label for="studentName">Nama murid</label><p><input id="studentName" class="input" placeholder="Contoh: Nur Aisyah" value="${esc(name)}" oninput="saveName()"></p><p class="muted">Nama disimpan pada peranti ini untuk sijil. Tiada maklumat dihantar ke pelayan.</p><div class="row"><button onclick="mapPage()">🏫 Mula Jelajah Sekolah</button><button class="yellow" onclick="startQuiz()">🏆 Cabaran 20 Soalan</button></div></section>${house()}<section class="panel"><h2>🎖️ Lencana Pencapaian</h2>${badges()}</section>`)}
function house(){return `<section class="panel"><h2>🏫 Peta Sekolah Harmoni</h2><p class="muted">Klik lokasi sekolah untuk meneroka nilai murni.</p><div class="house"><div style="font-size:22px;font-weight:800;margin-bottom:12px">SEKOLAH HARMONI 🌤️</div><div class="roof"></div><div class="rooms">${[['📖','Bilik Darjah',2],['📚','Perpustakaan',10],['🧑‍🏫','Pejabat',5],['🍚','Kantin',12],['🏟️','Dewan',0],['⚽','Padang',8]].map(([icon,label,id])=>`<button class="room" onclick="unitPage(${id})"><span style="font-size:26px">${icon}</span>${label}</button>`).join('')}</div><p>🌳 🌷 🚸 🌻 🌳</p></div></section>`}
function badges(){let v=visited.size;return `<div class="row">${[[5,'🌟 Penjelajah Baru'],[10,'🤝 Sahabat Sekolah'],[14,'🎓 Pakar Nilai'],[0,'🏆 Wira Moral']].map(([n,t],i)=>`<span class="pill">${(i===3?quizDone:v>=n)?'✅':'🔒'} ${t}</span>`).join('')}</div>`}
function mapPage(){setPage(`${house()}<section class="panel"><h2>📚 14 Misi Nilai Murni</h2><p>Telah diteroka: <strong>${visited.size}/14 unit</strong></p><div class="cards">${units.map((u,i)=>`<button class="card ${visited.has(i)?'done':''}" onclick="unitPage(${i})"><span style="font-size:32px">${u[6]}</span><strong>Unit ${i+1}: ${esc(u[0])}</strong><span>${esc(u[1])}</span><p class="muted">${visited.has(i)?'✅ Telah diteroka':'🔎 Teroka nota'}</p></button>`).join('')}</div></section>`)}
function unitPage(i){let u=units[i];visited.add(i);localStorage.setItem('moral3_visited',JSON.stringify([...visited]));setPage(`<section class="panel"><span class="pill">Unit ${i+1} / 14</span><div style="font-size:55px">${u[6]}</div><h2>${esc(u[1])}</h2><h3>Nilai: ${esc(u[0])}</h3><p><strong>Maksud:</strong> ${esc(u[2])}</p><h3>Contoh amalan:</h3><div class="example">✅ ${esc(u[3])}<br>✅ ${esc(u[4])}</div><p><strong>Kepentingan:</strong> ${esc(u[5])}</p><div class="row"><button onclick="speak(units[${i}][1]+'. Nilai '+units[${i}][0]+'. '+units[${i}][2]+'. Contohnya, '+units[${i}][3]+'. '+units[${i}][4]+'. Kepentingan, '+units[${i}][5])">🔊 Dengar Nota</button><button class="ghost" onclick="stopAudio()">⏹ Berhenti</button></div></section><section class="panel"><h2>🧠 Aktiviti Mini</h2><p>${esc(u[3])}. Apakah nilai yang paling sesuai?</p><div class="choices" id="miniChoices">${[i,(i+5)%14,(i+9)%14].map((v,j)=>`<button class="choice" onclick="miniCheck(${i},${j},this)">${'ABC'[j]}. ${esc(units[v][0])}</button>`).join('')}</div><p id="miniFeedback" aria-live="polite"></p></section><section class="panel row"><button class="ghost" onclick="mapPage()">← Semua Unit</button>${i<13?`<button onclick="unitPage(${i+1})">Unit Seterusnya →</button>`:`<button class="yellow" onclick="startQuiz()">🏆 Jawab Kuiz</button>`}</section>`)}
function miniCheck(i,j,btn){document.querySelectorAll('#miniChoices button').forEach(b=>b.disabled=true);btn.classList.add(j===0?'correct':'wrong');document.querySelectorAll('#miniChoices button')[0].classList.add('correct');document.querySelector('#miniFeedback').textContent=j===0?'✅ Tepat! Nilai '+units[i][0]+'.':'Belum tepat. Jawapan: '+units[i][0]+'.';}
const feelings=[['Rakan membantu kamu mengangkat buku.','Saya berasa gembira kerana rakan mengambil berat.'],['Kamu berani mengakui kesilapan.','Saya berasa lega kerana telah bercakap benar.'],['Kelas menjadi bersih selepas gotong-royong.','Saya berasa bangga kerana semua bekerjasama.'],['Kamu bertolak ansur dengan rakan.','Saya berasa tenang kerana kami saling menghormati.'],['Guru menghargai usaha kamu.','Saya berasa bersyukur kerana usaha saya dihargai.']];
function feelingPage(){setPage(`<section class="panel"><h2>😊 Perasaan Saya</h2><p>Pilih perasaan dan tulis alasan kamu berdasarkan situasi. Pelbagai jawapan munasabah diterima.</p>${feelings.map((f,i)=>`<div class="panel"><strong>Situasi ${i+1}: ${esc(f[0])}</strong><p><select class="input" id="feel${i}"><option value="">Pilih perasaan</option>${['Gembira','Bangga','Bersyukur','Tenang','Puas hati','Lega'].map(x=>`<option>${x}</option>`).join('')}</select></p><textarea id="reason${i}" placeholder="Saya berasa ... kerana ..."></textarea><p><button class="ghost" onclick="document.querySelector('#sample${i}').hidden=false">Lihat Contoh Jawapan</button></p><p id="sample${i}" class="example" hidden>${esc(f[1])}</p></div>`).join('')}<button onclick="mapPage()">Kembali ke Peta</button></section>`)}
function startQuiz(){if(!name.trim()){home();document.querySelector('#studentName').focus();toast('Masukkan nama murid dahulu.');return}answers=Array(20).fill(null);qi=0;quizDone=false;showQuestion()}
function showQuestion(){let q=qs[qi],answered=answers[qi]!==null;setPage(`<section class="panel"><span class="pill">Kuiz • Soalan ${qi+1} daripada 20</span> <span class="pill">Unit ${q.unit}</span><div class="bar" style="margin:18px 0"><div style="width:${(qi+(answered?1:0))*5}%"></div></div><h2>${esc(q.q)}</h2><p class="muted">Markah semasa: ${answers.reduce((s,a,k)=>s+(a===qs[k].answer?5:0),0)} / 100</p><div class="row" style="margin-bottom:12px"><button class="ghost" onclick="speak(qs[qi].q+'. '+qs[qi].options.map((x,i)=>'Pilihan '+['A','B','C','D'][i]+'. '+x).join('. '))">🔊 Dengar Soalan</button><button class="ghost" onclick="stopAudio()">⏹ Berhenti</button></div><div class="choices">${q.options.map((x,j)=>`<button class="choice ${answered?(j===q.answer?'correct':j===answers[qi]?'wrong':''):''}" onclick="choose(${j})" ${answered?'disabled':''}>${'ABCD'[j]}. ${esc(x)}</button>`).join('')}</div><div id="feedback" aria-live="polite">${answered?feedback(q):''}</div><p>${answered?`<button class="yellow" onclick="nextQ()">${qi===19?'Lihat Keputusan':'Soalan Seterusnya →'}</button>`:''}</p></section>`)}
function feedback(q){return `<div class="example"><strong>${answers[qi]===q.answer?'✅ Betul!':'❌ Belum tepat.'}</strong><p>Jawapan: ${'ABCD'[q.answer]}. ${esc(q.options[q.answer])}</p><p>${esc(q.why)}</p></div>`}
function choose(a){if(answers[qi]!==null)return;answers[qi]=a;showQuestion()}
function nextQ(){if(answers[qi]===null)return;if(qi<19){qi++;showQuestion()}else results()}
function score(){return answers.reduce((s,a,k)=>s+(a===qs[k].answer?5:0),0)}
function level(n){return n>=90?'Wira Moral Cemerlang':n>=70?'Wira Moral Hebat':n>=50?'Wira Moral Bijak':'Teruskan Usaha'}
function results(){quizDone=true;let s=score(),wrong=qs.map((q,i)=>answers[i]===q.answer?null:q.unit).filter(x=>x!==null);setPage(`<section class="panel" style="text-align:center"><div style="font-size:55px">🏆</div><h2>Tahniah, ${esc(name)}!</h2><p>Kamu telah menamatkan Cabaran Wira Moral Tahun 3.</p><h1>${s} / 100</h1><h3>${level(s)}</h3><p>✅ Betul: ${s/5}/20 &nbsp; ❌ Salah: ${20-s/5}/20</p><p>${wrong.length?'Unit untuk diulang kaji: '+[...new Set(wrong)].sort((a,b)=>a-b).join(', '):'Hebat! Semua jawapan betul.'}</p><div class="row" style="justify-content:center"><button onclick="review()">📋 Semak Jawapan</button><button class="yellow" onclick="certificate()">🎓 Lihat Sijil</button><button class="ghost" onclick="startQuiz()">🔄 Cuba Lagi</button></div></section>`)}
function review(){if(!quizDone){toast('Lengkapkan kuiz dahulu');return}setPage(`<section class="panel"><h2>📋 Semakan Jawapan</h2>${qs.map((q,i)=>`<div class="panel"><strong>${i+1}. ${esc(q.q)}</strong><p>Jawapan kamu: <strong>${'ABCD'[answers[i]]}. ${esc(q.options[answers[i]])}</strong> ${answers[i]===q.answer?'✅':'❌'}</p><p>Jawapan sebenar: <strong>${'ABCD'[q.answer]}. ${esc(q.options[q.answer])}</strong></p><p>${esc(q.why)}</p></div>`).join('')}<button onclick="results()">← Keputusan</button></section>`)}
function certificate(){if(!quizDone){toast('Lengkapkan 20 soalan dahulu');return}let s=score();setPage(`<div class="cert"><div style="font-size:48px">🏅 🌟 🏫 🌟 🏅</div><p>PENDIDIKAN MORAL TAHUN 3</p><h2>SIJIL WIRA MORAL</h2><p>Dengan sukacitanya sijil ini dianugerahkan kepada</p><div class="recipient">${esc(name)}</div><p>kerana berjaya melengkapkan</p><h3>Modul Ulang Kaji Interaktif<br>Misi Wira Moral — Jelajah Sekolah Harmoni</h3><p>Tema: <strong>Saya dan Sekolah</strong></p><p>Markah: <strong>${s}/100</strong> &nbsp; Tahap: <strong>${level(s)}</strong></p><p>Tarikh: ${new Date().toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'})}</p><div style="font-size:38px">🎓 ⭐ 🎓</div></div><div class="panel no-print row"><button onclick="window.print()">🖨️ Cetak / Simpan PDF</button><button class="ghost" onclick="results()">← Keputusan</button></div>`)}
function toggleAudio(){audioOn=!audioOn;if(!audioOn)stopAudio();updateHead()}
window.addEventListener('beforeunload',stopAudio);home();
</script></body></html>
